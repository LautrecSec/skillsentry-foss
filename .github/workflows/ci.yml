# SkillSentry FOSS modification (2026-10-28): independent, read-only fork validation.
name: SkillSentry FOSS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      LANGCHAIN_TRACING_V2: 'false'
      LANGSMITH_TRACING: 'false'
      UV_CACHE_DIR: .uv-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: '0.13.6'
          python-version: '3.12'
      - run: uv sync --locked --all-extras
      - run: uv run --no-sync python scripts/verify_upstream.py
      - run: uv run --no-sync ruff check src/skillsentry_foss tests/fork scripts/verify_upstream.py scripts/demo.py
      - run: uv run --no-sync ruff format --check src/skillsentry_foss tests/fork scripts/verify_upstream.py scripts/demo.py
      - run: uv run --no-sync pytest tests/fork -q -p no:cacheprovider
      - run: uv run --no-sync python scripts/demo.py
      - if: runner.os == 'Linux'
        run: uv run --no-sync pytest -m "not integration and not provider" tests --tb=short
      - run: uv run --no-sync python -m build --no-isolation
      - run: uv run --no-sync python -m twine check dist/*
  extensions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.20.0'
      - run: node --test tests/opencode/skillspector_scan_lib.test.ts
      - run: node --test tests/unit/test_pi_extension.mjs
